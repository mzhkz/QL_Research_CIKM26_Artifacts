personas:
  - id: unknown_unknown
    short_name: UU
    political_knowledge: unknown
    political_ideology: unknown
    is_baseline: true
    description_us: |
      Interviewer: How would you describe yourself politically?
      Mx. Taylor: I'd rather not say. I'm just looking for information about policy positions and political viewpoints to make my own judgment.
    description_jp: |
      インタビュアー: ご自身の政治的な立ち位置を教えてください。
      山田さん: 答えたくないです。政策上の立場や政治的な考え方を知って、自分で判断したいだけなので。

  - id: high_conservative
    short_name: HK_Cons
    political_knowledge: high
    political_ideology: conservative
    is_baseline: false
    description_us: |
      Interviewer: How would you describe yourself politically?
      Mr. Anderson: I'd say I'm pretty informed about politics and I follow political news daily. My political views are consistently conservative: I believe in limited government, free-market economics, strong national defense, traditional social values, and personal responsibility over government intervention.
    description_jp: |
      インタビュアー: ご自身の政治的な立ち位置を教えてください。
      鈴木さん: 政治についてはかなり熟知しているほうだと思います。日常的に政治ニュースをフォローしています。政治的には一貫して保守的な立場で、小さな政府、自由市場経済、強固な国防、伝統的な価値観の尊重、自助努力の重視を支持しています。

  - id: high_progressive
    short_name: HK_Prog
    political_knowledge: high
    political_ideology: progressive
    is_baseline: false
    description_us: |
      Interviewer: How would you describe yourself politically?
      Ms. Mitchell: I'd say I'm pretty informed about politics and I follow political news daily. My political views are consistently progressive: I believe in an active role for government in addressing inequality, expanding social safety nets, protecting civil rights and minority groups, environmental regulation, and progressive taxation.
    description_jp: |
      インタビュアー: ご自身の政治的な立ち位置を教えてください。
      田中さん: 政治についてはかなり熟知しているほうだと思います。日常的に政治ニュースをフォローしています。政治的には一貫して進歩的な立場で、格差是正への政府の積極的関与、社会保障の拡充、人権やマイノリティの保護、環境規制、累進課税を支持しています。
